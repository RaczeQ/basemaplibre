[tox]
envlist =
    python3.11
    python3.12
    python3.13
    python3.14
isolated_build = True
skip_missing_interpreters = True

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    test
deps =
    coverage
commands =
    coverage run --data-file=.coverage.doc.tests --source=basemaplibre -m pytest -v -s --durations=20 --doctest-modules --doctest-continue-on-failure basemaplibre
    coverage run --data-file=.coverage.base.tests --source=basemaplibre -m pytest -v -s --durations=20 tests
    coverage combine
    coverage xml -o coverage.{envname}.xml
    coverage report -m

[testenv:docs]
dependency_groups =
    docs
deps =
commands =
    jupyter nbconvert examples/*.ipynb --execute --to markdown --output-dir docs/examples --template-file scripts/example.md.j2 --TagRemovePreprocessor.enabled=True --TagRemovePreprocessor.remove_cell_tags colab --ExecutePreprocessor.skip_cells_with_tag=colab
    python scripts/gallery.py
    zensical build --clean --strict
