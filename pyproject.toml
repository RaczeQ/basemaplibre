[project]
name = "basemaplibre"
version = "0.0.1"
description = "Basemaps for matplotlib and GeoPandas from MapLibre styles, inspired by contextily."
readme = "README.md"
authors = [{ name = "Kamil Raczycki", email = "kraczycki@kraina.ai" }]
requires-python = ">=3.11"
dependencies = [
    "ml2drender>=0.4.3",
    "httpx>=0.28.1,<1",
    "matplotlib>=3.9.1",
    "numpy>=1.26",
    "pyproj>=3.6",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["maplibre", "basemap", "matplotlib", "geopandas", "contextily", "vector tiles", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/RaczeQ/basemaplibre"
Repository = "https://github.com/RaczeQ/basemaplibre"
Documentation = "https://raczeq.github.io/basemaplibre/"
Changelog = "https://github.com/RaczeQ/basemaplibre/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "bumpver>=2025.1131",
    "jupyter>=1.1",
]
lint = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
    "mypy>=1",
    "docformatter[tomli]>=1.7",
]
test = [
    "pytest>=8.4.2",
    "pytest-doctestplus>=1.4",
    "tox-uv>=1.29.0",
    "coverage>=7",
]
docs = [
    "zensical>=0.1.3",
    "mkdocstrings-python>=2.0.11",
    "nbconvert>=7.17",
    "ipykernel>=6.30.1",
    "geopandas>=1.0.1",
    "contextily>=1.6.2",
]

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "basemaplibre"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "I",   # isort
    "B",   # flake8-bugbear
    "NPY", # NumPy
    "YTT", # flake8-2020
    "Q",   # flake8-quotes
    "PLE",
    "PLW", # pylint (add "PLR" in the future)
    "PIE", # misc lints
    "TID", # tidy imports
    "ISC", # implicit string concatenation
    "TCH", # type-checking imports
]
ignore = ["D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.mypy]
strict = true
show_column_numbers = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.docformatter]
syntax = 'google'
black = true
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
tab-width = 4
blank = false
pre-summary-newline = true
close-quotes-on-newline = true
wrap-one-line = true

[tool.bumpver]
current_version = "0.0.1"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "chore(CI/CD): bump version {old_version} -> {new_version}"
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"$',
    '^version = "{version}"$',
]
"basemaplibre/__init__.py" = ['^__version__ = "{version}"$']

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
doctest_optionflags = [
    'ELLIPSIS',
    'NORMALIZE_WHITESPACE',
    'IGNORE_EXCEPTION_DETAIL',
]
